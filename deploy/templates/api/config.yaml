---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "api-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "{{ .Values.config.api.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "{{ .Values.config.api.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}"
  HTTP_PORTS: "{{ .Values.parameters.api.port_http | int | toString }}"
  ASPNETCORE_ENVIRONMENT: "{{ .Values.config.api.ASPNETCORE_ENVIRONMENT }}"
  CACHE_HOST: "{{ .Values.config.api.CACHE_HOST }}"
  CACHE_PORT: "{{ .Values.config.api.CACHE_PORT }}"
  APPDB_HOST: "{{ .Values.config.api.APPDB_HOST }}"
  APPDB_PORT: "{{ .Values.config.api.APPDB_PORT }}"
  APPDB_USERNAME: "{{ .Values.config.api.APPDB_USERNAME }}"
  APPDB_JDBCCONNECTIONSTRING: "{{ .Values.config.api.APPDB_JDBCCONNECTIONSTRING }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.config.api.OTEL_EXPORTER_OTLP_ENDPOINT }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "{{ .Values.config.api.OTEL_EXPORTER_OTLP_PROTOCOL }}"
  OTEL_SERVICE_NAME: "{{ .Values.config.api.OTEL_SERVICE_NAME }}"
