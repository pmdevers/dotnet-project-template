name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/template-app
      APPHOST_DIR: ./src/AppHost
      CHART_NAME: template-app
      CHARTS_PATH: ./deploy

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: dotnet tool install --global aspire.cli

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate containers
        run: aspire do push      

      - name: Publish Helm chart using Aspire
        run: aspire publish --output $CHARTS_PATH

      - name: Package Helm chart
        run: |
          mkdir -p $CHARTS_PATH/package
          helm package $CHARTS_PATH \
            --destination $CHARTS_PATH/package

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ${{ env.CHARTS_PATH }}/package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/package/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}