name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/template-app
      IMAGE_TAG: ${{ inputs.version }}
      APPHOST_DIR: ./src/AppHost
      CHART_NAME: template-app
      CHARTS_PATH: ./deploy
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Normalize version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5

      - name: Install Aspire CLI
        run: dotnet tool install --global aspire.cli

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate containers and Helm chart
        run: |
          aspire do push
          aspire publish --output $CHARTS_PATH

      - name: Package Helm chart
        run: |
          mkdir -p $CHARTS_PATH/package
          helm package $CHARTS_PATH \
            --destination $CHARTS_PATH/package \
            --version $VERSION

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: ${{ env.CHARTS_PATH }}/package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            deploy/package/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}